baseURL: "https://yohab-creator.github.io/blog/"
languageCode: "en-us"
title: "The Bridge: Multiversal Research"
theme: "PaperMod"

markup:
  highlight:
    style: github
  goldmark:
    renderer:
      unsafe: true
  math:
    enable: true
    render: katex

taxonomies:
  category: "categories"
  tag: "tags"
  series: "series"
  author: "authors"

menu:
  main:
    - identifier: "home"
      name: "Home"
      url: "/"
      weight: 10
    - identifier: "research"
      name: "Research"
      url: "/projects/"
      weight: 20
    - identifier: "publications" 
      name: "Publications"
      url: "/publications/"
      weight: 30
    - identifier: "blog"
      name: "Blog"
      url: "/posts/"
      weight: 40
    - identifier: "contact"
      name: "Contact"
      url: "#contact"
      weight: 50
    - identifier: "about"
      name: "About Me"
      url: "/about/"
      weight: 60

params:
  hideMeta: true      
  hideAuthor: true     # PaperMod native setting
  showReadingTime: false
  env: production
  defaultTheme: "minimal"
  description: "Advanced research across disciplinary boundaries"
  
  homeInfoParams:
    Title: "The Bridge: Multiversal Research"
    Content: "Explorations across topology, quantum mechanics, and multiverse theory."

  author:
    name: "Yohan"
    role: "Researcher"
    education:
      courses:
        - course: "BA in Mathematics and Physics"
          institution: "College of Wooster"
          year: 2024
    interests:
      - "Algebraic Topology"
      - "Quantum Mechanics" 
      - "Multiversal Theory"
      - "Advanced Computational Methods"
      - "Non-Euclidean Geometry"
    social:
      - icon: "envelope"
        icon_pack: "fas"
        link: "mailto:yohannesabateneh@gmail.com"
      - icon: "twitter"
        icon_pack: "fab"
        link: "https://twitter.com/username"
      - icon: "google-scholar"
        icon_pack: "ai"
        link: "https://scholar.google.com/citations?user=username"
      - icon: "github"
        icon_pack: "fab"
        link: "https://github.com/username"

  mainSections:
    - "posts"